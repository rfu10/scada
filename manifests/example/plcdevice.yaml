# A ControlLogix / CompactLogix PLC on the plant floor.
# The operator resolves driverRef to:
#   http://scada-driver-ethernet-ip.scada-system.svc.cluster.local:8080
apiVersion: scada.io/v1alpha1
kind: PLCDevice
metadata:
  name: conveyor-plc-1
  namespace: plant-floor
spec:
  protocol: ethernet-ip
  endpoint: "192.168.10.100:44818"
  params:
    slot: "0"
  scanInterval: "500ms"
  # driverRef defaults to service scada-driver-ethernet-ip in scada-system;
  # uncomment to override:
  # driverRef:
  #   serviceName: scada-driver-ethernet-ip
  #   namespace: scada-system
  #   port: 8080
