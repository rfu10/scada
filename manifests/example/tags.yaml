# Controller-scoped REAL tag — conveyor belt speed in RPM.
apiVersion: scada.io/v1alpha1
kind: Tag
metadata:
  name: conveyor-speed
  namespace: plant-floor
spec:
  deviceRef:
    name: conveyor-plc-1
  address: "ConveyorSpeed"
  dataType: REAL
  engineeringUnit: "RPM"
  description: "Conveyor belt speed"
  historianEnabled: true   # written to InfluxDB once observability is live
---
# Program-scoped BOOL — motor run status.
apiVersion: scada.io/v1alpha1
kind: Tag
metadata:
  name: motor-run
  namespace: plant-floor
spec:
  deviceRef:
    name: conveyor-plc-1
  address: "Program:MainProgram.Motor1.Run"
  dataType: BOOL
  description: "Motor 1 run bit"
  scanRate: "250ms"
---
# UDT member — motor fault code.
apiVersion: scada.io/v1alpha1
kind: Tag
metadata:
  name: motor-fault-code
  namespace: plant-floor
spec:
  deviceRef:
    name: conveyor-plc-1
  address: "Program:MainProgram.Motor1.FaultCode"
  dataType: DINT
  description: "Motor 1 fault code (0 = no fault)"
