---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tags.scada.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.0
spec:
  group: scada.io
  names:
    kind: Tag
    listKind: TagList
    plural: tags
    singular: tag
    shortNames:
    - stag
    categories:
    - scada
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Device
      type: string
      jsonPath: .spec.deviceRef.name
    - name: Address
      type: string
      jsonPath: .spec.address
    - name: Value
      type: string
      jsonPath: .status.value
    - name: Quality
      type: string
      jsonPath: .status.quality
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required: [deviceRef, address, dataType]
            properties:
              deviceRef:
                type: object
                required: [name]
                properties:
                  name:
                    type: string
              address:
                type: string
              dataType:
                type: string
                enum: [BOOL, SINT, INT, DINT, LINT, REAL, LREAL, STRING, WORD, DWORD, LWORD]
              scanRate:
                type: string
              engineeringUnit:
                type: string
              description:
                type: string
              historianEnabled:
                type: boolean
                default: false
          status:
            type: object
            properties:
              value:
                type: string
              quality:
                type: string
                enum: [GOOD, BAD, UNCERTAIN, UNKNOWN]
              timestamp:
                type: string
                format: date-time
              conditions:
                type: array
                items:
                  type: object
                  required: [type, status, lastTransitionTime, reason]
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string
