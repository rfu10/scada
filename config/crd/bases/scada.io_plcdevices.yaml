---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: plcdevices.scada.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.0
spec:
  group: scada.io
  names:
    kind: PLCDevice
    listKind: PLCDeviceList
    plural: plcdevices
    singular: plcdevice
    shortNames:
    - plc
    categories:
    - scada
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Protocol
      type: string
      jsonPath: .spec.protocol
    - name: Endpoint
      type: string
      jsonPath: .spec.endpoint
    - name: Connected
      type: boolean
      jsonPath: .status.connected
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required: [protocol, endpoint]
            properties:
              protocol:
                type: string
                enum: [ethernet-ip, opc-ua, modbus-tcp, modbus-rtu, dnp3]
              endpoint:
                type: string
              driverRef:
                type: object
                properties:
                  serviceName:
                    type: string
                  namespace:
                    type: string
                  port:
                    type: integer
                    format: int32
                    default: 8080
              params:
                type: object
                additionalProperties:
                  type: string
              scanInterval:
                type: string
                default: "1s"
          status:
            type: object
            properties:
              connected:
                type: boolean
              lastConnected:
                type: string
                format: date-time
              deviceInfo:
                type: string
              driverEndpoint:
                type: string
              conditions:
                type: array
                items:
                  type: object
                  required: [type, status, lastTransitionTime, reason]
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      type: integer
                      format: int64
