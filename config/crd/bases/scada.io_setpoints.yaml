---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: setpoints.scada.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.0
spec:
  group: scada.io
  names:
    kind: Setpoint
    listKind: SetpointList
    plural: setpoints
    singular: setpoint
    shortNames:
    - sp
    categories:
    - scada
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Tag
      type: string
      jsonPath: .spec.tagRef.name
    - name: Value
      type: string
      jsonPath: .spec.value
    - name: Mode
      type: string
      jsonPath: .spec.mode
    - name: Applied
      type: boolean
      jsonPath: .status.applied
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required: [tagRef, value]
            properties:
              tagRef:
                type: object
                required: [name]
                properties:
                  name:
                    type: string
              value:
                type: string
              mode:
                type: string
                enum: [once, continuous]
                default: once
          status:
            type: object
            properties:
              applied:
                type: boolean
              lastApplied:
                type: string
                format: date-time
              actualValue:
                type: string
              conditions:
                type: array
                items:
                  type: object
                  required: [type, status, lastTransitionTime, reason]
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string
