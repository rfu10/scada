[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scada-driver-sdk"
version = "0.1.0"
description = "Python SDK for writing SCADA protocol drivers compatible with the scada.io operator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[tool.hatch.build.targets.wheel]
packages = ["scada_driver_sdk"]
