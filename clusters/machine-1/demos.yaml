---
# Manages all demo projects under demo/.
# Add new demo namespaces to demo/kustomization.yaml; Flux picks them up
# on the next sync interval.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: demos
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./demo
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
  - name: scada-system   # CRDs must be installed first
